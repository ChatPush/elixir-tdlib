name: Обновление TDLib
description: Собрать tdlib_json_cli для коммита tdlib/td, перегенерировать типы и открыть PR
title: "Обновить TDLib"
labels: [tdlib-update]
body:
  - type: input
    id: td_commit
    attributes:
      label: Коммит td
      description: SHA коммита из https://github.com/tdlib/td/commits/master (7-40 символов)
      placeholder: 0e88653
    validations:
      required: true
  - type: input
    id: cli_ref
    attributes:
      label: Ref tdlib-json-cli
      description: >-
        Ветка, тег или коммит https://github.com/ChatPush/tdlib-json-cli, если пусто — master.
        Чтобы выпустить только правку tdlib-json-cli, оставьте коммит td из tdlib_binary.exs.
      placeholder: master
  - type: markdown
    attributes:
      value: |
        [Workflow обновления TDLib](../actions/workflows/tdlib-update.yml) пишет ход работы в этот issue: около 40 минут на сборку, затем ссылка на PR.
